version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        NEXT_PUBLIC_API_WEB_STACK_BASE_URL: ${NEXT_PUBLIC_API_WEB_STACK_BASE_URL}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_WEB_STACK_BASE_URL=${NEXT_PUBLIC_API_WEB_STACK_BASE_URL}
    networks:
      - webnet
    restart: always

networks:
  webnet:
    driver: bridge
